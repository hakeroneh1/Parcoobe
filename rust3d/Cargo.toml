[package]
name = "parcoobe3d"
version = "2.0.0"
edition = "2021"
description = "Parcoobe 3D — 3D-версия платформера Parcoobe (2D + вид от первого лица, один exe)"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
