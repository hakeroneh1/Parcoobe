[package]
name = "parcoobe"
version = "3.0.0"
edition = "2021"
description = "Parcoobe — платформер на Rust (переписан с GameMaker"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
